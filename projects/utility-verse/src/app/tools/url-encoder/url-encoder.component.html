<section class="rounded-2xl border border-slate-200 bg-slate-50 p-4 text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
  <header class="mb-4 flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 pb-3 dark:border-slate-700">
    <div>
      <h2 class="text-lg font-semibold">URL Encoder / Decoder</h2>
      <p class="text-xs text-slate-500 dark:text-slate-400">Encode query params and decode URL-safe payloads.</p>
    </div>
    <label class="inline-flex items-center gap-2 text-xs font-medium text-slate-600 dark:text-slate-300">
      <input type="checkbox" class="h-4 w-4" [checked]="plusForSpace()" (change)="plusForSpace.set($any($event.target).checked)" />
      Use + for spaces
    </label>
  </header>

  <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
    <textarea [value]="input()" (input)="onInput($event)" class="h-64 w-full rounded-md border border-slate-300 bg-white p-3 font-mono text-xs dark:border-slate-600 dark:bg-slate-800" placeholder="Input"></textarea>
    <textarea readonly [value]="output()" class="h-64 w-full rounded-md border border-slate-300 bg-slate-100 p-3 font-mono text-xs dark:border-slate-600 dark:bg-slate-950" placeholder="Output"></textarea>
  </div>

  <div class="mt-4 flex flex-wrap gap-2">
    <button type="button" class="rounded-md bg-emerald-600 px-3 py-2 text-xs font-semibold text-white" (click)="encode()">Encode</button>
    <button type="button" class="rounded-md bg-sky-600 px-3 py-2 text-xs font-semibold text-white" (click)="decode()">Decode</button>
    <button type="button" class="rounded-md border border-slate-300 px-3 py-2 text-xs font-semibold" (click)="copyOutput()">Copy Output</button>
    <button type="button" class="rounded-md border border-slate-300 px-3 py-2 text-xs font-semibold" (click)="clear()">Clear</button>
  </div>

  @if (error()) {
    <p class="mt-3 rounded-md border border-rose-300 bg-rose-100 px-3 py-2 text-xs text-rose-700 dark:border-rose-800 dark:bg-rose-900/30 dark:text-rose-300">{{ error() }}</p>
  }
</section>
