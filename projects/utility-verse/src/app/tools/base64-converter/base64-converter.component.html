<section class="rounded-2xl border border-slate-200 bg-slate-50 p-4 text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
  <header class="mb-4 flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 pb-3 dark:border-slate-700">
    <div>
      <h2 class="text-lg font-semibold">Base64 Converter</h2>
      <p class="text-xs text-slate-500 dark:text-slate-400">Unicode-safe encode/decode for text payloads</p>
    </div>

    <label class="inline-flex items-center gap-2 text-xs font-medium text-slate-600 dark:text-slate-300">
      <input
        type="checkbox"
        [checked]="urlSafe()"
        (change)="urlSafe.set($any($event.target).checked)"
        class="h-4 w-4 rounded border-slate-300 text-sky-600 focus:ring-sky-500"
      />
      URL-safe mode
    </label>
  </header>

  <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
    <lib-card title="Plain Text">
      <label class="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-300">Plain text input</label>
      <textarea
        [value]="plainText()"
        (input)="onPlainInput($event)"
        class="h-64 w-full rounded-md border border-slate-300 bg-white p-3 font-mono text-xs text-slate-900 focus:border-sky-500 focus:outline-none dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100"
        placeholder="Enter plain text"
      ></textarea>
    </lib-card>

    <lib-card title="Base64">
      <label class="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-300">Base64 input/output</label>
      <textarea
        [value]="base64Text()"
        (input)="onBase64Input($event)"
        class="h-64 w-full rounded-md border border-slate-300 bg-slate-100 p-3 font-mono text-xs text-slate-900 dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
        placeholder="Enter or generate Base64"
      ></textarea>
    </lib-card>
  </div>

  <div class="mt-4 flex flex-wrap gap-2">
    <lib-button variant="secondary" size="sm" (pressed)="encode()">Encode</lib-button>
    <lib-button variant="primary" size="sm" (pressed)="decode()">Decode</lib-button>
    <lib-button variant="ghost" size="sm" (pressed)="swap()">Use Output as Input</lib-button>
    <lib-button variant="ghost" size="sm" (pressed)="copyOutput()">Copy Output</lib-button>
    <lib-button variant="ghost" size="sm" (pressed)="clear()">Clear</lib-button>
  </div>

  @if (error()) {
    <p class="mt-3 rounded-md border border-rose-300 bg-rose-100 px-3 py-2 text-xs font-medium text-rose-700 dark:border-rose-800 dark:bg-rose-900/30 dark:text-rose-300">
      {{ error() }}
    </p>
  }
</section>
