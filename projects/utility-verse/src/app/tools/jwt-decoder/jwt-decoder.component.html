<section class="rounded-2xl border border-slate-200 bg-slate-50 p-4 text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
  <header class="mb-4 border-b border-slate-200 pb-3 dark:border-slate-700">
    <h2 class="text-lg font-semibold">JWT Decoder</h2>
    <p class="text-xs text-slate-500 dark:text-slate-400">Decode Header/Payload locally. No token verification.</p>
  </header>

  <textarea [value]="token()" (input)="onInput($event)" class="h-24 w-full rounded-md border border-slate-300 bg-white p-3 font-mono text-xs dark:border-slate-600 dark:bg-slate-800" placeholder="Paste JWT token"></textarea>

  <div class="mt-3 flex flex-wrap gap-2">
    <button type="button" class="rounded-md bg-sky-600 px-3 py-2 text-xs font-semibold text-white" (click)="decode()">Decode Token</button>
    <button type="button" class="rounded-md border border-slate-300 px-3 py-2 text-xs font-semibold" (click)="clear()">Clear</button>
  </div>

  @if (error()) {
    <p class="mt-3 rounded-md border border-rose-300 bg-rose-100 px-3 py-2 text-xs text-rose-700 dark:border-rose-800 dark:bg-rose-900/30 dark:text-rose-300">{{ error() }}</p>
  }

  <div class="mt-4 grid grid-cols-1 gap-4 xl:grid-cols-3">
    <article class="rounded-md border border-slate-200 bg-white p-3 dark:border-slate-700 dark:bg-slate-950">
      <div class="mb-2 flex items-center justify-between">
        <h3 class="text-xs font-semibold">Header</h3>
        <button type="button" class="text-[11px] text-sky-600" (click)="copy('header')">Copy</button>
      </div>
      <textarea readonly [value]="header()" class="h-56 w-full rounded-md border border-slate-300 bg-slate-100 p-2 font-mono text-xs dark:border-slate-600 dark:bg-slate-900"></textarea>
    </article>

    <article class="rounded-md border border-slate-200 bg-white p-3 dark:border-slate-700 dark:bg-slate-950">
      <div class="mb-2 flex items-center justify-between">
        <h3 class="text-xs font-semibold">Payload</h3>
        <button type="button" class="text-[11px] text-sky-600" (click)="copy('payload')">Copy</button>
      </div>
      <textarea readonly [value]="payload()" class="h-56 w-full rounded-md border border-slate-300 bg-slate-100 p-2 font-mono text-xs dark:border-slate-600 dark:bg-slate-900"></textarea>
    </article>

    <article class="rounded-md border border-slate-200 bg-white p-3 dark:border-slate-700 dark:bg-slate-950">
      <div class="mb-2 flex items-center justify-between">
        <h3 class="text-xs font-semibold">Signature</h3>
        <button type="button" class="text-[11px] text-sky-600" (click)="copy('signature')">Copy</button>
      </div>
      <textarea readonly [value]="signature()" class="h-56 w-full rounded-md border border-slate-300 bg-slate-100 p-2 font-mono text-xs dark:border-slate-600 dark:bg-slate-900"></textarea>
    </article>
  </div>
</section>
