<section class="rounded-2xl border border-slate-200 bg-slate-50 p-4 text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
  <header class="mb-4 flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 pb-3 dark:border-slate-700">
    <div>
      <h2 class="text-lg font-semibold">Text Utilities</h2>
      <p class="text-xs text-slate-500 dark:text-slate-400">Transform text quickly with reusable operations</p>
    </div>

    <div class="flex flex-wrap gap-2 text-xs">
      <span class="rounded-md bg-slate-100 px-2 py-1 dark:bg-slate-800">Chars: <strong>{{ stats().chars }}</strong></span>
      <span class="rounded-md bg-slate-100 px-2 py-1 dark:bg-slate-800">Words: <strong>{{ stats().words }}</strong></span>
      <span class="rounded-md bg-slate-100 px-2 py-1 dark:bg-slate-800">Lines: <strong>{{ stats().lines }}</strong></span>
    </div>
  </header>

  <div class="mb-3">
    <label class="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-300">Operation</label>
    <select
      [value]="selectedOperation()"
      (change)="onOperationChange($event)"
      class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm focus:border-sky-500 focus:outline-none dark:border-slate-600 dark:bg-slate-800"
    >
      @for (item of operations; track item.value) {
        <option [value]="item.value">{{ item.label }}</option>
      }
    </select>
  </div>

  <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
    <div>
      <label class="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-300">Input</label>
      <textarea
        [value]="inputText()"
        (input)="onInputChange($event)"
        class="h-72 w-full rounded-md border border-slate-300 bg-white p-3 font-mono text-xs focus:border-sky-500 focus:outline-none dark:border-slate-600 dark:bg-slate-800"
        placeholder="Paste source text"
      ></textarea>
    </div>

    <div>
      <label class="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-300">Output</label>
      <textarea
        readonly
        [value]="outputText()"
        class="h-72 w-full rounded-md border border-slate-300 bg-slate-100 p-3 font-mono text-xs dark:border-slate-600 dark:bg-slate-950"
        placeholder="Transformed text"
      ></textarea>
    </div>
  </div>

  <div class="mt-4 flex flex-wrap gap-2">
    <button type="button" class="rounded-md bg-sky-600 px-3 py-2 text-xs font-semibold text-white hover:bg-sky-500" (click)="useOutputAsInput()">Use Output as Input</button>
    <button type="button" class="rounded-md border border-slate-300 px-3 py-2 text-xs font-semibold hover:bg-slate-100 dark:border-slate-600 dark:hover:bg-slate-800" (click)="copyOutput()">Copy Output</button>
    <button type="button" class="rounded-md border border-slate-300 px-3 py-2 text-xs font-semibold hover:bg-slate-100 dark:border-slate-600 dark:hover:bg-slate-800" (click)="clear()">Clear</button>
  </div>
</section>
