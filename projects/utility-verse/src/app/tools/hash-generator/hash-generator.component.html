<section class="rounded-2xl border border-slate-200 bg-slate-50 p-4 text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
  <header class="mb-4 flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 pb-3 dark:border-slate-700">
    <div>
      <h2 class="text-lg font-semibold">Hash Generator</h2>
      <p class="text-xs text-slate-500 dark:text-slate-400">Generate deterministic hashes from text input.</p>
    </div>

    <label class="flex items-center gap-2 text-xs">
      <span class="text-slate-600 dark:text-slate-300">Algorithm</span>
      <select [value]="algorithm()" (change)="onAlgorithmChange($event)" class="rounded-md border border-slate-300 bg-white px-2 py-1 text-xs dark:border-slate-600 dark:bg-slate-800">
        @for (algo of algorithms; track algo) {
          <option [value]="algo">{{ algo }}</option>
        }
      </select>
    </label>
  </header>

  <textarea [value]="input()" (input)="onInput($event)" class="h-40 w-full rounded-md border border-slate-300 bg-white p-3 font-mono text-xs dark:border-slate-600 dark:bg-slate-800" placeholder="Text to hash"></textarea>

  <div class="mt-2 text-[11px] text-slate-500 dark:text-slate-400">Input bytes: {{ inputBytes() }}</div>

  <div class="mt-3 flex flex-wrap gap-2">
    <button type="button" class="rounded-md bg-sky-600 px-3 py-2 text-xs font-semibold text-white" (click)="generate()">{{ busy() ? 'Generating...' : 'Generate Hash' }}</button>
    <button type="button" class="rounded-md border border-slate-300 px-3 py-2 text-xs font-semibold" (click)="copyOutput()">Copy Output</button>
    <button type="button" class="rounded-md border border-slate-300 px-3 py-2 text-xs font-semibold" (click)="clear()">Clear</button>
  </div>

  <textarea readonly [value]="output()" class="mt-3 h-28 w-full rounded-md border border-slate-300 bg-slate-100 p-3 font-mono text-xs dark:border-slate-600 dark:bg-slate-950" placeholder="Hex digest"></textarea>

  @if (error()) {
    <p class="mt-3 rounded-md border border-rose-300 bg-rose-100 px-3 py-2 text-xs text-rose-700 dark:border-rose-800 dark:bg-rose-900/30 dark:text-rose-300">{{ error() }}</p>
  }
</section>
